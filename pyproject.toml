[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilo-backend"
version = "0.1.0"
description = "Backend foundation for the Vigilo resilience-aware logistics engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
    "supabase>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100,<7.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["apps/api"]
